[project]
name = "drl-labs"
version = "0.1.0"
description = "Deep Reinforcement Learning Lab Exercises"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "gymnasium[classic-control]>=0.29.0",
    "torch>=2.0.0",
	"ipython >= 8.0.0",
	"ipykernel > 7.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
jupyter = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "debugpy>1.8.0",
]